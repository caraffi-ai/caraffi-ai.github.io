name: Update DAWG DYNASTY data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/update_dawg_data.py"
      - ".github/workflows/update-dawg-data.yml"

permissions:
  contents: write

concurrency:
  group: dawg-dynasty-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build validated league snapshot
        run: python scripts/update_dawg_data.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          p='dawg-dynasty/data/league.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert len(d.get('rosters', [])) == 12, f"expected 12 rosters, got {len(d.get('rosters', []))}"
          assert d.get('league', {}).get('name'), 'league name missing'
          print('league:', d['league']['name'])
          print('season:', d['league'].get('season'))
          print('rosters:', len(d['rosters']))
          print('completed trades:', len(d.get('trades', [])))
          print('historical seasons:', [x.get('season') for x in d.get('seasons', [])])
          PY

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dawg-dynasty/data/league.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh DAWG DYNASTY league data"
            git push
          fi
