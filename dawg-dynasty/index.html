tween;gap:10px;align-items:center}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.mini div{padding:9px;background:#0d1117;border-radius:9px;border:1px solid #222a35}.mini b{display:block;font-size:18px}.mini span{font-size:8px;color:#7f8998}.bars{display:grid;gap:7px;margin-top:13px}.barrow{display:grid;grid-template-columns:30px 1fr 35px;gap:8px;font-size:10px;align-items:center}.bar{height:6px;background:#29313d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#b7ff4a}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}.trade .sides{display:grid;grid-template-columns:1fr 35px 1fr;gap:8px;align-items:center;margin:12px 0}.sidebox{padding:11px;background:#0d1117;border-radius:9px;min-height:82px}.arrow{text-align:center;color:#b7ff4a;font-size:20px}.meter{height:8px;background:linear-gradient(90deg,#ff7777,#f6c85f,#68d391);border-radius:10px;position:relative;margin-top:12px}.dot{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #111;transform:translateX(-50%)}.awards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.award .icon{font-size:28px}.winner{color:#b7ff4a;font-weight:800;margin:8px 0}.page{display:none}.page.on{display:block}.loading{margin-top:24px;padding:22px;border:1px solid #27303d;border-radius:15px;background:#11151d}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:22px;z-index:5}.modal.on{display:grid}.modalin{width:min(950px,96vw);max-height:90vh;overflow:auto;background:#10141b;border:1px solid #394657;border-radius:17px;padding:22px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plist{background:#0d1117;border:1px solid #242d38;border-radius:11px;padding:12px}.prow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #222a35;font-size:12px}.close{float:right;border:0;background:transparent;color:white;font-size:26px;cursor:pointer} </style></head><body><div class="shell"><aside class="side"><div class="brand">DAWG DYNASTY</div><div class="sub">12-Team • Superflex • PPR</div><div class="nav"><button class="on" data-page="rank">🏆 Power Rankings</button><button data-page="teams">🧠 Team War Rooms</button><button data-page="ideas">🤝 Trades That Should Be Made</button><button data-page="trades">⚖️ Trade Center / Fleece Meter</button><button data-page="awards">🎖️ Awards Center</button></div><div class="foot">Sleeper League<br>1311852361739694080</div></aside><main class="main"><div class="top"><div><div class="eyebrow">DAWG DYNASTY</div><h1 id="title">League Power Rankings</h1></div><div class="pill" id="status">Syncing Sleeper…</div></div><div id="load" class="loading">Pulling live managers, rosters, future picks and dynasty values…</div><section id="rank" class="page on"></section><section id="teams" class="page"></section><section id="ideas" class="page"></section><section id="trades" class="page"></section><section id="awards" class="page"></section></main></div><div class="modal" id="modal"><div class="modalin"><button class="close" onclick="closeModal()">×</button><div id="modalbody"></div></div></div><script>
const L='1311852361739694080',S='https://api.sleeper.app/v1';let league,users=[],rosters=[],players={},picks=[],tx=[],teams=[],dyn=new Map(),red=new Map();const $=s=>document.querySelector(s),fmt=n=>Math.round(n||0).toLocaleString();async function j(u){let r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.json()}function vm(rows){let m=new Map;for(let x of rows||[]){let id=x?.player?.sleeperId??x?.sleeperId;if(id)m.set(String(id),{v:+(x.value||0),age:+(x?.player?.age||0)||null})}return m}async function fc(d){let u=new URL('https://api.fantasycalc.com/values/current');u.searchParams.set('isDynasty',d);u.searchParams.set('numQbs',2);u.searchParams.set('numTeams',12);u.searchParams.set('ppr',1);return j(u)}function info(id){let p=players[id]||{},d=dyn.get(id)||{},r=red.get(id)||{};return{id,name:p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||id,pos:p.position||'',team:p.team||'FA',age:d.age||null,dv:d.v||0,rv:r.v||0}}function norm(a){let lo=Math.min(...a),hi=Math.max(...a);return a.map(v=>hi==lo?50:(v-lo)/(hi-lo)*100)}function pickVal(y,r){let now=+(league.season||2026),base={1:3800,2:1800,3:850,4:350,5:150}[r]||100;return base*Math.pow(.9,Math.max(0,y-now))}function owned(rid){let now=+(league.season||2026),rounds=league.settings?.draft_rounds||4,out=[];for(let y=now+1;y<=now+3;y++)for(let r=1;r<=rounds;r++){let mv=picks.find(x=>+x.season==y&&+x.round==r&&+x.roster_id==rid),owner=mv?+mv.owner_id:rid;if(owner==rid)out.push({y,r,from:rid})}for(let p of picks){let y=+p.season,r=+p.round;if(+p.owner_id==rid&&+p.roster_id!=rid&&y>=now+1&&y<=now+3&&!out.some(x=>x.y==y&&x.r==r&&x.from==+p.roster_id))out.push({y,r,from:+p.roster_id})}return out}function bestLine(ps,key){let slots=league.roster_positions||['QB','RB','RB','WR','WR','TE','FLEX','SUPER_FLEX'],used=new Set,total=0;function take(el){let bi=-1,b=null;ps.forEach((p,i)=>{if(!used.has(i)&&el.includes(p.pos)&&(!b||p[key]>b[key])){b=p;bi=i}});if(b){used.add(bi);total+=b[key]||0}}for(let s of slots){if(s=='QB')take(['QB']);else if(s=='RB')take(['RB']);else if(s=='WR')take(['WR']);else if(s=='TE')take(['TE']);else if(s=='FLEX')take(['RB','WR','TE']);else if(s.includes('SUPER'))take(['QB','RB','WR','TE'])}return total}function build(){teams=rosters.map(r=>{let u=users.find(x=>x.user_id==r.owner_id)||{},ps=(r.players||[]).map(x=>info(String(x))).sort((a,b)=>b.dv-a.dv),op=owned(+r.roster_id),pc=op.reduce((s,p)=>s+pickVal(p.y,p.r),0),dr=ps.slice(0,16).reduce((s,p,i)=>s+p.dv*(i<10?1:.45),0),cr=bestLine(ps,'rv')||bestLine(ps,'dv'),pos={};for(let q of ['QB','RB','WR','TE'])pos[q]=ps.filter(p=>p.pos==q).reduce((s,p)=>s+p.dv,0);return{id:+r.roster_id,name:u.metadata?.team_name||u.display_name||'Roster '+r.roster_id,owner:u.display_name||'',ps,op,pc,dr,cr,pos}});let cn=norm(teams.map(t=>t.cr)),dn=norm(teams.map(t=>t.dr)),pn=norm(teams.map(t=>t.pc));teams.forEach((t,i)=>t.power=.45*cn[i]+.4*dn[i]+.15*pn[i]);teams.sort((a,b)=>b.power-a.power).forEach((t,i)=>t.rank=i+1);for(let k of ['QB','RB','WR','TE']) [...teams].sort((a,b)=>b.pos[k]-a.pos[k]).forEach((t,i)=>t[k+'r']=i+1);[...teams].sort((a,b)=>b.cr-a.cr).forEach((t,i)=>t.cont=i+1);[...teams].sort((a,b)=>b.dr-a.dr).forEach((t,i)=>t.dyr=i+1);[...teams].sort((a,b)=>b.pc-a.pc).forEach((t,i)=>t.pr=i+1)}function badge(t){return t.cont<=4?'Contender':t.pr<=3&&t.cont>=8?'Rebuilder':t.cont<=6||t.dyr<=6?'In the Mix':'Retooling'}function bars(t){return ['QB','RB','WR','TE'].map(k=>`<div class="barrow"><b>${k}</b><div class="bar"><i style="width:${(13-t[k+'r'])/12*100}%"></i></div><span>#${t[k+'r']}</span></div>`).join('')}function render(){let a=teams[0],c=[...teams].sort((x,y)=>y.cr-x.cr)[0],p=[...teams].sort((x,y)=>y.pc-x.pc)[0];$('#rank').innerHTML=`<div class="hero"><div class="card"><div class="eyebrow">#1 Dynasty Franchise</div><div class="big">${a.name}</div><div class="muted">Power score ${a.power.toFixed(1)} / 100</div></div><div class="card"><div class="eyebrow">Best Win-Now</div><div class="big">${c.name}</div><div class="muted">Highest starting-lineup market value</div></div><div class="card"><div class="eyebrow">Draft Capital King</div><div class="big">${p.name}</div><div class="muted">#1 future pick inventory</div></div></div><div class="section"><h2>League Power Rankings</h2><div class="muted">45% contender strength • 40% dynasty core • 15% future draft capital</div><div class="panel"><table><thead><tr><th>Rank</th><th>Team</th><th>Power</th><th>Win Now</th><th>Dynasty</th><th>Picks</th><th>Mode</th></tr></thead><tbody>${teams.map(t=>`<tr onclick="openTeam(${t.id})"><td class="rank">#${t.rank}</td><td><b>${t.name}</b><br><small class="muted">${t.owner}</small></td><td>${t.power.toFixed(1)}</td><td>#${t.cont}</td><td>#${t.dyr}</td><td>#${t.pr}</td><td><span class="badge">${badge(t)}</span></td></tr>`).join('')}</tbody></table></div></div>`;$('#teams').innerHTML=`<div class="section"><h2>Team War Rooms</h2><p class="muted">Click a team for roster, positional ranks, future picks and franchise direction.</p><div class="grid">${teams.map(t=>`<div class="team" onclick="openTeam(${t.id})"><div class="line"><b>${t.name}</b><span class="badge">#${t.rank}</span></div><div class="mini"><div><b>#${t.cont}</b><span>WIN NOW</span></div><div><b>#${t.dyr}</b><span>DYNASTY</span></div><div><b>#${t.pr}</b><span>PICKS</span></div></div><div class="bars">${bars(t)}</div></div>`).join('')}</div></div>`;renderIdeas();renderTrades();renderAwards()}function weak(t){return ['QB','RB','WR','TE'].map(k=>({k,r:t[k+'r']})).sort((a,b)=>b.r-a.r)}function cand(t,k){let x=t.ps.filter(p=>p.pos==k&&p.dv>0).sort((a,b)=>b.dv-a.dv);return x.slice(x.length>2?1:0,5)}function renderIdeas(){let out=[];for(let i=0;i<teams.length;i++)for(let z=i+1;z<teams.length;z++){let A=teams[i],B=teams[z],an=weak(A)[0],bn=weak(B)[0];if(an.k==bn.k||A[bn.k+'r']>6||B[an.k+'r']>6)continue;let best;for(let x of cand(A,bn.k))for(let y of cand(B,an.k)){let d=Math.abs(x.dv-y.dv)/Math.max(x.dv,y.dv,1);if(!best||d<best.d)best={x,y,d}}if(best&&best.d<.35)out.push({A,B,...best,an,bn})}out.sort((a,b)=>a.d-b.d);$('#ideas').innerHTML=`<div class="section"><h2>Trades That Should Be Made</h2><p class="muted">Pairs complementary roster needs with similarly valued assets.</p><div class="twocol">${out.slice(0,8).map(o=>`<div class="trade"><div class="line"><b>${o.A.name} × ${o.B.name}</b><span class="badge">Gap ${Math.round(o.d*100)}%</span></div><div class="sides"><div class="sidebox"><b>${o.A.name} gets</b><p>${o.y.name}<br><small class="muted">${o.y.pos} • ${fmt(o.y.dv)}</small></p></div><div class="arrow">⇄</div><div class="sidebox"><b>${o.B.name} gets</b><p>${o.x.name}<br><small class="muted">${o.x.pos} • ${fmt(o.x.dv)}</small></p></div></div></div>`).join('')||'<div class="card">No clean matches generated yet.</div>'}</div></div>`}function rosterName(id){return teams.find(t=>t.id==+id)?.name||'Roster '+id}function renderTrades(){let trades=tx.filter(x=>x.type=='trade').sort((a,b)=>b.created-a.created).slice(0,20);$('#trades').innerHTML=`<div class="section"><h2>Trade Center / Fleece Meter</h2><p class="muted">Hindsight grading using today’s dynasty values.</p><div class="twocol">${trades.map(t=>{let ids=t.roster_ids||[];if(ids.length<2)return'';let vals={};ids.forEach(id=>vals[id]=0);for(let [pid,rid] of Object.entries(t.adds||{}))vals[rid]=(vals[rid]||0)+(dyn.get(String(pid))?.v||0);for(let p of t.draft_picks||[])vals[p.owner_id]=(vals[p.owner_id]||0)+pickVal(+p.season,+p.round);let a=ids[0],b=ids[1],av=vals[a]||0,bv=vals[b]||0,gap=Math.abs(av-bv)/Math.max(av,bv,1),pct=100*av/Math.max(av+bv,1);return`<div class="trade"><div class="line"><small class="muted">${new Date(t.created).toLocaleDateString()}</small><span class="badge">${gap<.1?'EVEN':gap<.22?'EDGE':'FLEECE ALERT'}</span></div><div class="sides"><div class="sidebox"><b>${rosterName(a)}</b><div class="big" style="font-size:20px">${fmt(av)}</div></div><div class="arrow">⇄</div><div class="sidebox"><b>${rosterName(b)}</b><div class="big" style="font-size:20px">${fmt(bv)}</div></div></div><div class="meter"><i class="dot" style="left:${Math.max(3,Math.min(97,pct))}%"></i></div></div>`}).join('')||'<div class="card">No trades found in the current transaction window.</div>'}</div></div>`}function renderAwards(){let by=f=>[...teams].sort(f)[0],a=teams[0],c=by((x,y)=>y.cr-x.cr),p=by((x,y)=>y.pc-x.pc),q=by((x,y)=>y.pos.QB-x.pos.QB),r=by((x,y)=>y.pos.RB-x.pos.RB),w=by((x,y)=>y.pos.WR-x.pos.WR),te=by((x,y)=>y.pos.TE-x.pos.TE);let list=[['👑','Dynasty Alpha',a,'#1 overall franchise'],['🔥','Win-Now Maniac',c,'Best starting lineup'],['🧾','Draft Capital Hoarder',p,'Most future pick value'],['🚀','QB Factory',q,'Best QB room'],['🐎','RB Stable',r,'Best RB room'],['🎯','WR Arms Dealer',w,'Best WR room'],['🧱','TE University',te,'Best TE room']];$('#awards').innerHTML=`<div class="section"><h2>Awards Center</h2><p class="muted">Automatically generated from the current league snapshot.</p><div class="awards">${list.map(x=>`<div class="award"><div class="icon">${x[0]}</div><b>${x[1]}</b><div class="winner">${x[2].name}</div><small class="muted">${x[3]}</small></div>`).join('')}</div></div>`}window.openTeam=id=>{let t=teams.find(x=>x.id==id),n=weak(t),best=[...n].sort((a,b)=>a.r-b.r)[0],worst=n[0];$('#modalbody').innerHTML=`<div class="eyebrow">Team War Room</div><h1>${t.name}</h1><p class="muted">Power #${t.rank} • Win-now #${t.cont} • Dynasty #${t.dyr} • Picks #${t.pr} • ${badge(t)}</p><div class="hero"><div class="card"><div class="eyebrow">Best Unit</div><div class="big">${best.k} #${best.r}</div></div><div class="card"><div class="eyebrow">Biggest Need</div><div class="big">${worst.k} #${worst.r}</div></div><div class="card"><div class="eyebrow">Future Picks</div><div class="big">${t.op.length}</div></div></div><h2>Roster</h2><div class="players">${['QB','RB','WR','TE'].map(k=>`<div class="plist"><b>${k} • Rank #${t[k+'r']}</b>${t.ps.filter(p=>p.pos==k).slice(0,8).map(p=>`<div class="prow"><span>${p.name}<br><small class="muted">${p.team}${p.age?' • '+p.age:''}</small></span><b>${fmt(p.dv)}</b></div>`).join('')}</div>`).join('')}</div><h2 style="margin-top:18px">Future Pick Chest</h2><p>${t.op.map(p=>`<span class="badge">${p.y} R${p.r}${p.from!=t.id?' from #'+p.from:''}</span>`).join(' ')||'No tracked future picks'}</p>`;$('#modal').classList.add('on')};window.closeModal=()=>$('#modal').classList.remove('on');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$('#'+b.dataset.page).classList.add('on');$('#title').textContent={rank:'League Power Rankings',teams:'Team War Rooms',ideas:'Trades That Should Be Made',trades:'Trade Center / Fleece Meter',awards:'Awards Center'}[b.dataset.page]});async function load(){try{league=await j(`${S}/league/${L}`);let [u,r,p,tp,d,rd]=await Promise.all([j(`${S}/league/${L}/users`),j(`${S}/league/${L}/rosters`),j(`${S}/players/nfl`),j(`${S}/league/${L}/traded_picks`).catch(()=>[]),fc(true).catch(()=>[]),fc(false).catch(()=>[])]);users=u;rosters=r;players=p;picks=tp;dyn=vm(d);red=vm(rd);let z=await Promise.all(Array.from({length:19},(_,w)=>j(`${S}/league/${L}/transactions/${w}`).catch(()=>[])));tx=z.flat();build();render();$('#load').style.display='none';$('#status').textContent='LIVE • '+league.season;$('#status').classList.add('ok')}catch(e){$('#load').innerHTML='<b>Live sync failed.</b><br><span class="muted">'+e.message+'</span>';$('#status').textContent='SYNC ERROR';console.error(e)}}load();
</script></body></html>
